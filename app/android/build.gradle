buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        // ⚠️ Play 요구 최소 대상 API (2025-08-31부터 35). 34로는 **업로드가 거부된다.**
        //    2026-08-31부터는 36이 필요하다 → Gradle 8.11+ / AGP 8.9+ 업그레이드가 따라온다.
        //    (지금 AGP 8.6이라 compileSdk 36을 못 올린다. 별도 작업으로 진행 — docs/08 §2-6)
        targetSdkVersion = 35
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.25"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // React Native Firebase: google-services.json 처리 플러그인
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"
